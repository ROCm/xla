base_config: "base.yml"

model_name: "llama2-70b"
run_name: "llama70b-8gpu"
hardware: "gpu"

weight_dtype: "float32"
grad_dtype: "float32"
mu_dtype: "float32"

ici_fsdp_parallelism: 8
ici_fsdp_transpose_parallelism: 1
ici_data_parallelism: 1
ici_tensor_parallelism: 1
ici_tensor_sequence_parallelism: 1
ici_sequence_parallelism: 1
ici_context_parallelism: 1
ici_context_autoregressive_parallelism: 1
ici_expert_parallelism: 1
ici_pipeline_parallelism: 1
ici_autoregressive_parallelism: 1
ici_diloco_parallelism: 1

dcn_data_parallelism: 1
dcn_fsdp_parallelism: 1
dcn_fsdp_transpose_parallelism: 1
dcn_tensor_parallelism: 1
dcn_tensor_sequence_parallelism: 1
dcn_sequence_parallelism: 1
dcn_context_parallelism: 1
dcn_context_autoregressive_parallelism: 1
dcn_expert_parallelism: 1
dcn_pipeline_parallelism: 1
dcn_autoregressive_parallelism: 1
dcn_diloco_parallelism: 1

num_slices: 1
gradient_accumulation_steps: 1

attention: "cudnn_flash_te"
max_segments_per_seq: 1

max_target_length: 4096
per_device_batch_size: 15
remat_policy: "full"
scan_layers: true

opt_type: "adamw"
adam_b1: 0.9
adam_b2: 0.95
adam_eps: 1.e-8
adam_weight_decay: 0.1
gradient_clipping_threshold: 1.0
learning_rate: 3.e-4
warmup_steps_fraction: 0.01
learning_rate_final_fraction: 0.1
learning_rate_schedule_steps: 100000

dataset_type: "synthetic"
reuse_example_batch: 1

enable_checkpointing: false
async_checkpointing: false
steps: 30

dump_hlo: false
profiler: ""
jax_cache_dir: ""

use_iota_embed: true
enable_tensorboard: false
enable_goodput_recording: false
monitor_goodput: false
