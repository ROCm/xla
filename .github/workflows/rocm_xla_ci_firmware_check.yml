name: CI ROCm Firmware Check

on:
  pull_request:
    branches:
      - rocm-dev-infra
    paths:
      - .github/workflows/rocm_xla_ci_firmware_check.yml

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.pool }}
    runs-on: amd-do-linux-xla-gpu-gfx950-dpx-1
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        pool:
          - linux_x64_gpu
    container:
      image: ghcr.io/rocm/jax-base-ubu24.therock-latest@sha256:b97ba4a0b5eea809806da706ddd3372ef3a60d47f6475bf9024fb8eb8b662a1e
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openxla/xla
          ref: main
          persist-credentials: false

      - name: Test XLA [single_gpu] on ${{ matrix.pool }}
        run: |
          ROCM_SDK_ROOT="$(rocm-sdk path --root)"
          test -d "${ROCM_SDK_ROOT}"
          build_tools/rocm/run_xla_ci_build.sh \
            --config=rocm_ci_hermetic \
            --config=rocm_rbe_dynamic \
            --config=ci_single_gpu \
            --jobs=50 \
            --strategy=TestRunner=remote \
            --cache_test_results=no \
            --keep_going \
            --local_test_jobs=1 \
            --repo_env=TF_ROCM_RBE_DOCKER_IMAGE=ghcr.io/rocm/jax-base-ubu24.therock-latest@sha256:b97ba4a0b5eea809806da706ddd3372ef3a60d47f6475bf9024fb8eb8b662a1e \
            --repo_env=TF_ROCM_AMDGPU_TARGETS=gfx950 \
            --repo_env=ROCM_PATH="${ROCM_SDK_ROOT}" \
            --repo_env=TF_ROCM_RBE_SINGLE_GPU_POOL=${{ matrix.pool }} \
            --bes_keywords=firmware_check \
            -- \
            //xla/...
