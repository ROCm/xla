# Deploys the Pages site when the scaling book changes.
#
# A Pages deployment replaces the entire site, so this builds every section,
# not just the scaling book -- otherwise publishing a scaling-book edit would
# delete /ci-metrics and /perf-metrics. The build itself lives in the composite
# action all three Pages workflows share; see
# .github/actions/build-pages-site/action.yml.
#
# The companion workflows, ci_metrics_pages.yml and perf_metrics_pages.yml, are
# the same deployment driven from their own sides. All three are serialised by
# the `pages` concurrency group.

name: Deploy scaling book

on:
  push:
    branches: [rocm-dev-infra]
    paths:
      - scaling_book/**
      - .github/workflows/scaling_book_pages.yml
      - .github/actions/build-pages-site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued run supersede an in-progress one, but never cancel a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6
        id: pages

      - uses: ./.github/actions/build-pages-site
        with:
          base_path: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
