name: ROCm Perf Nightly

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Daily run at 02:00 UTC.
    - cron: '00 2 * * *'
  pull_request_target:
    types: [labeled]
  pull_request:
    branches:
      - rocm-dev-infra
    paths:
      - '.github/workflows/rocm_xla_perf_nightly.yml'
      # So that edits to the perf_tools dir themselves get exercised.
      - 'perf_tools/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.label.name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DATA_BRANCH: perf-metrics-data

jobs:
  rocm-config:
    runs-on: ubuntu-latest
    outputs:
      docker-image: ${{ steps.out.outputs.docker-image }}
      therock-version: ${{ steps.therock.outputs.therock_version }}
      # The benchmark matrix as JSON. Drives the matrix below *and* is recorded
      # verbatim in run.json, so a published directory says which ROCm build
      # produced it.
      modes: ${{ steps.matrix.outputs.modes }}
      # Upstream XLA commit under test, resolved once so that every matrix mode
      # measures the *same* tree instead of racing a moving `main`.
      xla-sha: ${{ steps.xla.outputs.sha }}
      xla-sha6: ${{ steps.xla.outputs.sha6 }}
      # Run stamp, shared by every mode so one run lands in one directory.
      stamp: ${{ steps.xla.outputs.stamp }}
      iso: ${{ steps.xla.outputs.iso }}
    steps:
      - id: out
        shell: bash
        run: |
          echo "docker-image=ghcr.io/rocm/jax-build-ubu24.rocmless@sha256:68854ed30b800d3e8c390f6e651721e2bead58830da1c59e1b828354eb8f077f" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve the XLA commit under test and stamp the run
        id: xla
        shell: bash
        run: |
          sha="$(git ls-remote https://github.com/openxla/xla.git refs/heads/main | cut -f1)"
          [ -n "$sha" ] || { echo "could not resolve openxla/xla main" >&2; exit 1; }
          {
            echo "sha=$sha"
            echo "sha6=${sha:0:6}"
            echo "stamp=$(date -u +%Y%m%dT%H%M%SZ)"
            echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Benchmarking openxla/xla @ ${sha:0:6} ($sha)"

      - name: Detect latest TheRock version
        id: therock
        env:
          ROCM_PIP_SOURCE: prerelease
          GPU_TARGET: device-all
          ROCM_SDK_VERSION: '10.2'
          PIP_INDEX_PATH: ''
          THEROCK_INDEX_URL: 'https://rc.repo.amd.com/rocm/whl-next/'
        run: bash build_tools/rocm/detect-therock-version.sh

      # The stacks to benchmark, defined here rather than inline under
      # `strategy.matrix` so that one definition serves both readers of it.
      # publish-perf-metrics needs the whole matrix to record it in run.json,
      # and a matrix job cannot supply that: each job sees only its own entry,
      # and matrix jobs overwrite each other's outputs. Hard-coding the list a
      # second time in the publish job is exactly the copy that would drift,
      # so both read it from here instead.
      - name: Build the benchmark matrix
        id: matrix
        shell: bash
        env:
          THEROCK_VERSION: ${{ steps.therock.outputs.therock_version }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          # One pool for every mode: the stacks are only comparable when the
          # same hardware measured them.
          RUNNER = "amd-do-linux-xla-gpu-gfx950-dpx-4"
          nightly = os.environ["THEROCK_VERSION"]

          modes = [
              {
                  "name": "therock_release_10.0",
                  "release": "10.0.0",
                  "distro_url": "https://stable.repo.amd.com/rocm/core/tarball/therock-dist-linux-multiarch-10.0.0.tar.gz",
                  "distro_hash": "1c5e807875d26a2470ecc7323daa5b5b9009208a55c3290ac255a909cde15fc6",
                  "runner": RUNNER,
              },
              {
                  "name": "therock_release_10.1",
                  "release": "10.1.0",
                  "distro_url": "https://stable.repo.amd.com/rocm/core/tarball/therock-dist-linux-multiarch-10.1.0.tar.gz",
                  "distro_hash": "a95c72f0052168f2262365dff71c2259331721ad0a65da7957dc7d96ccb77021",
                  "runner": RUNNER,
              },
              {
                  "name": "therock_nightly",
                  "release": nightly,
                  "distro_url": f"https://rc.repo.amd.com/rocm/core/tarball/therock-dist-linux-multiarch-{nightly}.tar.gz",
                  # Resolved fresh every night, so there is no digest to pin it
                  # to; `release` above is what identifies which build this was.
                  "distro_hash": "no_hash",
                  "runner": RUNNER,
              },
          ]
          for m in modes:
              print(f"{m['name']:21s} {m['release']:12s} {m['distro_hash']}", file=sys.stderr)
          # One line: a GITHUB_OUTPUT value cannot span lines without a
          # heredoc delimiter, and this is read back with fromJSON().
          print("modes=" + json.dumps(modes, separators=(",", ":")))
          PY

  execute-xla-perf-nightly:
    needs: rocm-config
    # Run on schedule, workflow_dispatch, "nightly-pipeline" label, or PR to rocm-dev-infra with workflow changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'nightly-pipeline' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'rocm-dev-infra')
    runs-on: ${{ matrix.mode.runner }}
    env:
      COMMON_ARGS: >-
        --config=rocm_ci_hermetic
        --repo_env=TF_ROCM_AMDGPU_TARGETS=gfx950
      ROCM_DISTRO_ARGS: >-
        --repo_env=ROCM_PATH=
        --repo_env=ROCM_DISTRO_URL=${{ matrix.mode.distro_url }}
        --repo_env=ROCM_DISTRO_HASH=${{ matrix.mode.distro_hash }}
      ROCM_BB_CACHE_ARGS: >-
        --remote_cache="grpcs://cas.bb-rbe.amd.com"
        --tls_client_certificate="/data/bb-rbe-client.crt"
        --tls_client_key="/data/bb-rbe-client.key"
        --tls_certificate="/data/bb-rbe-ca.crt"
        --remote_timeout=3600
        --remote_cache_compression
      MODE: ${{ matrix.mode.name }}
      # Stamp applied to every result row, so rows stay self-describing once
      # they are concatenated across runs for plotting.
      STAMP_ISO: ${{ needs.rocm-config.outputs.iso }}
      STAMP_SHA6: ${{ needs.rocm-config.outputs.xla-sha6 }}
    strategy:
      fail-fast: false
      matrix:
        # The entries are built by rocm-config's "Build the benchmark matrix"
        # step; that is where a stack is added, removed or re-pinned.
        mode: ${{ fromJSON(needs.rocm-config.outputs.modes) }}
    container:
      image: ${{ needs.rocm-config.outputs.docker-image }}

    steps:
      - name: Check out the XLA tree under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This workflow benchmarks the upstream XLA source tree, pinned to the
          # commit rocm-config resolved so all modes agree.
          repository: openxla/xla
          ref: ${{ needs.rocm-config.outputs.xla-sha }}
          path: xla-src
          persist-credentials: false

      - name: Check out the perf tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # perf_tools/ (the HLO dumps, the runner scripts and the latency tool)
          # lives in this fork only, not in the upstream tree checked out above.
          path: perf-tools-src
          persist-credentials: false

      - name: Generate required environment to run under hermetic rocm [${{ matrix.mode.name }}]
        working-directory: xla-src
        run: |
          bazel_sandbox_dir="$(bazel info ${ROCM_BB_CACHE_ARGS} ${COMMON_ARGS} ${ROCM_DISTRO_ARGS} output_base)"
          ROCM_DIST="${bazel_sandbox_dir}/external/+rocm_configure_ext+local_config_rocm/rocm/rocm_dist"
          LD_LIBRARY_PATH="${ROCM_DIST}/lib:${ROCM_DIST}/lib/rocm_sysdeps/lib:${LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "ROCM_DIST=${ROCM_DIST}" >> "$GITHUB_ENV"

      - name: Build and run multihost_hlo_runner [${{ matrix.mode.name }}]
        working-directory: xla-src
        env:
          # Read by the --run_under shim. Absolute, because `bazel run` starts
          # the command in the runfiles tree.
          HLO_EVAL_OUT: ${{ runner.temp }}/raw/hlo_eval
          HLO_EVAL_REPEATS: 5
        run: |
          mkdir -p "$RUNNER_TEMP/raw"
          # --run_under hands the script the binary bazel just built, so the
          # path never has to be reconstructed from the output base -- that
          # spelling bakes in both the `k8-opt` configuration fragment and the
          # canonical `+rocm_configure_ext+local_config_rocm` repo name.
          # The flags must match the build step above, or this runs in a
          # different configuration and rebuilds instead of hitting the cache.
          bazel run -c opt \
            ${ROCM_BB_CACHE_ARGS} \
            ${COMMON_ARGS} \
            ${ROCM_DISTRO_ARGS} \
            --repo_env=LD_LIBRARY_PATH=${LD_LIBRARY_PATH} \
            --run_under="${GITHUB_WORKSPACE}/perf-tools-src/perf_tools/hlo_eval_tools/run_1gpu_perf_under.sh" \
            //xla/tools/multihost_hlo_runner:hlo_runner_main

      - name: Build and run rocm_latency_check_tool [${{ matrix.mode.name }}]
        # The latency numbers characterise the ROCm runtime rather than the XLA
        # tree, so measuring them once -- on the newest stack -- is enough; the
        # release modes would only re-measure the same interconnect.
        if: matrix.mode.name == 'therock_nightly'
        working-directory: perf-tools-src
        run: |
          mkdir -p "$RUNNER_TEMP/raw"
          cd ./perf_tools/rocm_latency_check_tool
          "${ROCM_DIST}/bin/hipcc" -O3 -std=c++17 \
            rocm_latency_check_tool.cpp -pthread -o rocm_latency_check_tool
          # The tool appends to --csv and only writes the header when the file is
          # empty, so all three GPU counts accumulate into one CSV.
          for n in 1 2 4; do
            ./rocm_latency_check_tool \
              --num-gpus "$n" \
              --csv "$RUNNER_TEMP/raw/latency.csv" \
              --label "$MODE"
          done

      - name: Stamp results with the run date and XLA commit [${{ matrix.mode.name }}]
        # Runs even if a perf step failed, so a partial pass still publishes the
        # modules that did complete.
        if: always()
        run: |
          out="$RUNNER_TEMP/out/$MODE"
          mkdir -p "$out"

          # Prepend timestamp/commit/mode to the header and to every data row.
          # A plain prepend, so existing quoted fields are left untouched.
          stamp_file() {
            local src=$1 dst=$2 sep=$3
            [ -s "$src" ] || { echo "note: $src missing or empty, skipping" >&2; return; }
            awk -v ts="$STAMP_ISO" -v c="$STAMP_SHA6" -v m="$MODE" -v OFS="$sep" '
              NR == 1 { print "timestamp", "commit", "mode", $0; next }
                      { print ts, c, m, $0 }
            ' "$src" > "$dst"
          }

          stamp_file "$RUNNER_TEMP/raw/hlo_eval.tsv" "$out/hlo_eval.tsv" $'\t'
          stamp_file "$RUNNER_TEMP/raw/latency.csv"  "$out/latency.csv"  ','
          ls -l "$out"

      - name: Upload stamped results [${{ matrix.mode.name }}]
        # Transport to publish-perf-metrics only, not a published deliverable:
        # that job assembles every mode into one commit on the data branch and
        # then deletes these artifacts. retention-days is only the backstop for
        # the case where it never gets that far.
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: perf-results-${{ matrix.mode.name }}
          path: ${{ runner.temp }}/out/${{ matrix.mode.name }}
          if-no-files-found: warn
          retention-days: 1

  publish-perf-metrics:
    needs: [rocm-config, execute-xla-perf-nightly]
    # Publish whatever completed, even if some modes failed. PR runs publish
    # too, so that a change to this workflow exercises the push path as well.
    if: always() && needs.rocm-config.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the data branch back to this repository.
      contents: write
      # Needed to delete the transport artifacts once the push has landed.
      actions: write
    env:
      STAMP: ${{ needs.rocm-config.outputs.stamp }}
      ISO: ${{ needs.rocm-config.outputs.iso }}
      XLA_SHA: ${{ needs.rocm-config.outputs.xla-sha }}
      SHA6: ${{ needs.rocm-config.outputs.xla-sha6 }}
      # The ROCm builds this run benchmarked, recorded in run.json. The whole
      # matrix, not just the modes that published results: a stack that failed
      # outright is part of what the run was, and the pair of lists says which
      # is which.
      MODES_JSON: ${{ needs.rocm-config.outputs.modes }}
      THEROCK_VERSION: ${{ needs.rocm-config.outputs.therock-version }}
    steps:
      - name: Check out the perf tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # For perf_tools/publish_perf_metrics.sh, which every step below
          # runs. The push uses its own token, so no stored credentials here.
          persist-credentials: false

      - name: Download the per-mode results
        # If every mode failed there is nothing to download; the assemble step
        # below detects that and no-ops rather than failing the run.
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: perf-results-*
          path: ${{ runner.temp }}/artifacts

      - name: Assemble the run directory
        id: assemble
        run: ./perf_tools/publish_perf_metrics.sh assemble

      - name: Push the results to the ${{ env.DATA_BRANCH }} branch
        if: steps.assemble.outputs.empty == 'false'
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./perf_tools/publish_perf_metrics.sh push

      - name: Delete the transport artifacts
        # Runs only once the results are safely on the data branch; if the push
        # failed they are worth keeping for the day retention-days allows.
        if: steps.assemble.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./perf_tools/publish_perf_metrics.sh cleanup
