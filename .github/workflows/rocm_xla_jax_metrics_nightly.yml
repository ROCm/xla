name: CI ROCm XLA JAX PR run metrics collection

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Run every 24 hours at 3:47 AM UTC
    - cron: '47 3 * * *'
  pull_request_target:
    types: [labeled]
  pull_request:
    branches:
      - rocm-dev-infra
    paths:
      - '.github/workflows/rocm_xla_jax_metrics_nightly.yml'
      # So that edits to the collection scripts themselves get exercised.
      - 'ci-metrics/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci-metrics:
    # Run on schedule, workflow_dispatch, "nightly-pipeline" label, or PR to rocm-dev-infra with workflow changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'nightly-pipeline' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'rocm-dev-infra')
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the report and data branches back to this repository.
      contents: write
    env:
      # ci-metrics/*.py and the `gh` CLI both read GH_TOKEN. GITHUB_TOKEN is
      # limited to 1000 API requests/hour/repo, which a one-day window fits into;
      # set a CI_METRICS_TOKEN secret (public-repo read scope) to get the full
      # 5000/hour budget if the window is ever widened.
      GH_TOKEN: ${{ secrets.CI_METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      REPORT_BRANCH: ci-metrics-reports
      DATA_BRANCH: ci-metrics-data
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Unlike the test jobs, this one runs the ci-metrics scripts that live
          # in *this* repository, not in the upstream XLA tree.
          persist-credentials: false

      - name: Set up the one-day collection window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          # Current time yesterday .. current time today, in UTC.
          until_ts="$(date -u +%Y-%m-%dT%H:%M:%S)"
          since_ts="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%S)"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "since=$since_ts"   >> "$GITHUB_OUTPUT"
          echo "until=$until_ts"   >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp"      >> "$GITHUB_OUTPUT"
          echo "Collecting ${since_ts}Z .. ${until_ts}Z (stamp $stamp)"

      - name: Collect runs, jobs and step timings
        working-directory: ci-metrics
        run: |
          python3 collect.py \
            --since "${{ steps.window.outputs.since }}" \
            --until "${{ steps.window.outputs.until }}" \
            --out "$RUNNER_TEMP/data/${{ steps.window.outputs.stamp }}"

      - name: Fetch earlier attempts of re-run jobs
        working-directory: ci-metrics
        run: python3 fetch_attempts.py --data "$RUNNER_TEMP/data/${{ steps.window.outputs.stamp }}"

      - name: Sample job logs for test counts and critical path
        working-directory: ci-metrics
        run: python3 sample_logs.py --data "$RUNNER_TEMP/data/${{ steps.window.outputs.stamp }}"

      - name: Render the HTML and Markdown report
        working-directory: ci-metrics
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # report.py writes the .md next to the .html from the same render, so
          # both files always carry the same numbers.
          python3 report.py \
            --data "$RUNNER_TEMP/data/${{ steps.window.outputs.stamp }}" \
            --since "${{ steps.window.outputs.since }}" \
            --until "${{ steps.window.outputs.until }}" \
            --html "$RUNNER_TEMP/out/ci-metrics-${{ steps.window.outputs.stamp }}.html"

      - name: Push the report to the ${{ env.REPORT_BRANCH }} branch
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAMP: ${{ steps.window.outputs.stamp }}
          SINCE: ${{ steps.window.outputs.since }}
          UNTIL: ${{ steps.window.outputs.until }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/publish-report"
          rm -rf "$work" && mkdir -p "$work" && cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin "$REPORT_BRANCH"; then
            git checkout -q -b "$REPORT_BRANCH" FETCH_HEAD
          else
            echo "$REPORT_BRANCH does not exist yet; creating it"
            git checkout -q -b "$REPORT_BRANCH"
          fi
          mkdir -p reports
          cp "$RUNNER_TEMP/out/ci-metrics-${STAMP}.html" reports/
          cp "$RUNNER_TEMP/out/ci-metrics-${STAMP}.md" reports/
          git add -A reports
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -q -m "ci-metrics report ${STAMP} (${SINCE}Z..${UNTIL}Z)"
            git push -q origin "$REPORT_BRANCH"
          fi

      - name: Push the collected data to the ${{ env.DATA_BRANCH }} branch
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAMP: ${{ steps.window.outputs.stamp }}
          SINCE: ${{ steps.window.outputs.since }}
          UNTIL: ${{ steps.window.outputs.until }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/publish-data"
          rm -rf "$work" && mkdir -p "$work" && cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin "$DATA_BRANCH"; then
            git checkout -q -b "$DATA_BRANCH" FETCH_HEAD
          else
            echo "$DATA_BRANCH does not exist yet; creating it"
            git checkout -q -b "$DATA_BRANCH"
          fi
          mkdir -p "data/${STAMP}"
          cp -a "$RUNNER_TEMP/data/${STAMP}/." "data/${STAMP}/"
          git add -A data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -q -m "ci-metrics data ${STAMP} (${SINCE}Z..${UNTIL}Z)"
            git push -q origin "$DATA_BRANCH"
          fi
