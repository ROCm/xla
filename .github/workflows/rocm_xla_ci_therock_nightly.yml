name: CI theRock Nightly

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      gpu_target:
        description: 'GPU target for pip index (device-all = multi-arch whl-multi-arch)'
        type: choice
        options:
          - 'device-all'
          - 'gfx950-dcgpu'
          - 'gfx94X-dcgpu'
        default: 'device-all'
      rocm_pip_source:
        description: 'ROCm pip source'
        type: choice
        options:
          - 'nightlies'
          - 'devreleases'
          - 'prereleases'
          - 'release'
        default: 'nightlies'
      rocm_sdk_version:
        description: 'ROCm SDK / THEROCK version (empty = latest)'
        type: string
        required: false
        default: '10.0'
      pip_index_path:
        description: 'Override pip index path (e.g. whl, whl-staging, v2, v2-staging)'
        type: string
        default: ''
      therock_index_url:
        description: 'Fully override THEROCK_INDEX_URL (empty = derive from channel + gpu_target)'
        type: string
        default: ''
      runner_label:
        description: 'On which runner to run'
        type: string
        default: "linux-xla-do-mi350x-1"
  schedule:
    # Run every 24 hours at 5:00 AM UTC
    - cron: '00 5 * * *'
  pull_request_target:
    types: [labeled]
  pull_request:
    branches:
      - rocm-dev-infra
    paths:
      - '.github/workflows/rocm_xla_ci_therock_nightly.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  execute-xla-ut-therock-ci:
    runs-on: ubuntu-latest
    outputs:
      docker-image: ${{ steps.out.outputs.docker-image }}
    steps:
      - id: out
        shell: bash
        run: |
          # hermetic llvm based rocmless docker image
          echo "docker-image=ghcr.io/rocm/jax-build-ubu24.rocmless@sha256:68854ed30b800d3e8c390f6e651721e2bead58830da1c59e1b828354eb8f077f" >> "$GITHUB_OUTPUT"

  xla:
    needs: execute-xla-ut-therock-ci
    name: XLA Linux theRock nightly CI
    runs-on: ${{ inputs.runner_label || 'linux-xla-do-mi350x-1' }}
    timeout-minutes: 220
    env:
      DOCKER_IMAGE: ${{ needs.execute-xla-ut-therock-ci.outputs.docker-image }}
      EXECUTE_DETECT_THEROCK_VERSION_URL: https://raw.githubusercontent.com/ROCm/xla/refs/heads/${{ inputs.rocm_xla_branch || 'rocm-dev-infra' }}/build_tools/rocm/detect-therock-version.sh
      EXECUTE_CI_BUILD_URL: https://raw.githubusercontent.com/ROCm/xla/refs/heads/${{ inputs.rocm_xla_branch || 'rocm-dev-infra' }}/build_tools/rocm/execute_ci_build_upstream.sh
      RUN_XAL_CI_BUILD_URL: https://raw.githubusercontent.com/ROCm/xla/refs/heads/${{ inputs.rocm_xla_branch || 'rocm-dev-infra' }}/build_tools/rocm/run_xla_ci_build.sh
    container:
      image: ${{ needs.execute-xla-ut-therock-ci.outputs.docker-image }} # zizmor: ignore[unpinned-images] image is pinned in the rocm-config job.
      volumes: &rocm_container_volumes
        - /data/ci-cert.crt:/data/ci-cert.crt
        - /data/ci-cert.key:/data/ci-cert.key
        - /data:/data
      options: &rocm_container_options >-
        --device=/dev/dri
        --device=/dev/kfd
        --ipc=host
        --shm-size=64G
        --cap-add=SYS_PTRACE
        --security-opt=seccomp=unconfined
        --tmpfs /root/.cache/bazel:rw,exec,size=80g
        --group-add video
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    defaults:
      run:
        shell: bash
    steps:
      - name: Checking out openxla/xla
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openxla/xla
          persist-credentials: false

      - name: Fetch theRock version detection from ROCm/xla
        run: |
          wget -O build_tools/rocm/detect-therock-version.sh "${EXECUTE_DETECT_THEROCK_VERSION_URL}"
          chmod +x build_tools/rocm/detect-therock-version.sh

      - name: Resolve TheRock index URL and version
        id: therock
        env:
          ROCM_PIP_SOURCE: ${{ inputs.rocm_pip_source || 'nightlies' }}
          GPU_TARGET: ${{ inputs.gpu_target || 'device-all' }}
          ROCM_SDK_VERSION: ${{ inputs.rocm_sdk_version || '10.0' }}
          PIP_INDEX_PATH: ${{ inputs.pip_index_path || '' }}
          THEROCK_INDEX_URL: ${{ inputs.therock_index_url || '' }}
        run: bash build_tools/rocm/detect-therock-version.sh

      - name: Fetch ROCm XLA Upstream Script from ROCm/xla
        run: |
          wget -O build_tools/rocm/execute_ci_build_upstream.sh "${EXECUTE_CI_BUILD_URL}"
          chmod +x build_tools/rocm/execute_ci_build_upstream.sh

      - name: Fetch Run CI test Upstream Script from ROCm/xla
        run: |
          wget -O build_tools/rocm/run_xla_ci_build.sh "${RUN_XAL_CI_BUILD_URL}"
          chmod +x build_tools/rocm/run_xla_ci_build.sh

      - name: CPU Info
        run: lscpu

      - name: ROCm info
        run: |
          if command -v rocminfo >/dev/null 2>&1; then
            "$(command -v rocminfo)"
          elif [ -x /opt/rocm/bin/rocminfo ]; then
            /opt/rocm/bin/rocminfo
          else
            echo "rocminfo not found in this container image; skipping diagnostic step."
          fi

      - name: Test XLA [single_gpu]
        env:
          THEROCK_VERSION: ${{ steps.therock.outputs.therock_version }}
        timeout-minutes: 120
        run: |
          build_tools/rocm/execute_ci_build_upstream.sh \
            --config=rocm_ci_hermetic \
            --config=rocm_rbe \
            --config=ci_single_gpu \
            --local_test_jobs=1 \
            --repo_env=TF_ROCM_RBE_DOCKER_IMAGE="${DOCKER_IMAGE}" \
            --repo_env=ROCM_DISTRO_URL="https://rocm.nightlies.amd.com/tarball-multi-arch/therock-dist-linux-multiarch-${THEROCK_VERSION}.tar.gz" \
            --repo_env=ROCM_DISTRO_HASH='' \
            --local_test_jobs=1 \
            --internal_spawn_scheduler \
            --strategy=TestRunner=dynamic \
            --bes_keywords=xla \
            --bes_keywords=upstream \
            --bes_keywords=gpu \
            --bes_keywords=pull_request \
      - name: Test XLA [rocm_cpu]
        env:
          THEROCK_VERSION: ${{ steps.therock.outputs.therock_version }}
        timeout-minutes: 80
        run: |
          build_tools/rocm/execute_ci_build_upstream.sh \
            --config=rocm_ci_hermetic \
            --config=rocm_rbe \
            --config=ci_rocm_cpu \
            --local_test_jobs=200 \
            --repo_env=TF_ROCM_RBE_DOCKER_IMAGE="${DOCKER_IMAGE}" \
            --repo_env=ROCM_PATH="" \
            --repo_env=ROCM_DISTRO_URL="https://rocm.nightlies.amd.com/tarball-multi-arch/therock-dist-linux-multiarch-${THEROCK_VERSION}.tar.gz" \
            --repo_env=ROCM_DISTRO_HASH='' \
            --bes_keywords=xla \
            --bes_keywords=upstream \
            --bes_keywords=cpu \
            --bes_keywords=pull_request
