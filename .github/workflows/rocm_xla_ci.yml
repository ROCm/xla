name: CI ROCm Internal
permissions:
  contents: read
on:
  push:
    branches:
      - 'rocm-jaxlib-v0.8.*'
      - 'rocm-jaxlib-v0.9.*'
      - 'rocm-jaxlib-v0.10.*'
  pull_request_target:
    types: [opened, synchronize]
    branches:
      - 'rocm-jaxlib-v0.8.*'
      - 'rocm-jaxlib-v0.9.*'
      - 'rocm-jaxlib-v0.10.*

concurrency:
  group: ${{ github.event.pull_request.number && format('CI ROCm-PR-{0}', github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  rocm-config:
    runs-on: ubuntu-latest
    outputs:
      docker-image: ${{ steps.out.outputs.docker-image }}
    steps:
      - id: out
        shell: bash
        run: |
          echo "docker-image=${{ vars.DOCKER_IMAGE }}" >> "$GITHUB_OUTPUT"

  execute-xla-ut:
    needs: rocm-config
    runs-on: amd-do-linux-xla-gpu-gfx950-dpx-4
    strategy:
      fail-fast: false
      matrix:
        mode:
          - {name: "default", configs: ["--config=rocm_ci_hermetic", "--config=rocm_rbe_dynamic"]}
    container: &rocm_container
      image: ${{ needs.rocm-config.outputs.docker-image }}
    env:
      DOCKER_IMAGE: ${{ needs.rocm-config.outputs.docker-image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: CPU Info
        run: lscpu

      - name: ROCm info
        run: /opt/rocm/bin/rocminfo

      - name: Test XLA [${{ matrix.mode.name }}] [single_gpu]
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            ${{ join(matrix.mode.configs, ' ') }} \
            --config=ci_single_gpu \
            --local_test_jobs=4 \
            --repo_env=TF_ROCM_RBE_SINGLE_GPU_POOL=linux_x64_gpu_do_gfx950 \
            --repo_env=TF_ROCM_RBE_DOCKER_IMAGE="${DOCKER_IMAGE}" \
            --bes_keywords=xla \
            --bes_keywords=release \
            --bes_keywords=single_gpu \
            --bes_keywords=pull_request
      - name: Test XLA [${{ matrix.mode.name }}] [multi_gpu]
        if: always() && !cancelled()
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            ${{ join(matrix.mode.configs, ' ') }} \
            --config=ci_multi_gpu \
            --local_test_jobs=1 \
            --strategy=TestRunner=local \
            --repo_env=TF_ROCM_RBE_DOCKER_IMAGE=${{ vars.DOCKER_IMAGE }} \
            --bes_keywords=xla \
            --bes_keywords=release \
            --bes_keywords=multi_gpu \
            --bes_keywords=pull_request
      - name: Test XLA [rocm_cpu]
        if: always() && !cancelled()
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            --config=ci_rocm_cpu \
            --local_test_jobs=50 \
            --repo_env=TF_ROCM_RBE_DOCKER_IMAGE="${DOCKER_IMAGE}" \
            --bes_keywords=xla \
            --bes_keywords=release \
            --bes_keywords=cpu \
            --bes_keywords=pull_request
