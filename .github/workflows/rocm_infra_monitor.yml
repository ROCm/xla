name: ROCm Nightly Failure Monitor
permissions:
  actions: read
  contents: read
  issues: write

env:
  # Repository and workflow being monitored: our own nightly pipeline.
  MONITORED_REPO: ROCm/xla
  MONITORED_WORKFLOW: rocm_xla_ci_nightly.yml
  # This workflow, used to find out when we last looked.
  SELF_WORKFLOW: rocm_infra_monitor.yml
  # Steps whose name contains this marker are known-red and not reported.
  # The pipeline already tags each test step with its mode - "[single_gpu]",
  # "[multi_gpu]", "[rocm_cpu]" - so the mode tag is the marker.
  # TODO: enable when multigpu is green (set this to an empty value).
  IGNORED_STEP_MARKER: '[multi_gpu]'

on:
  schedule:
    # Run every hour; each run checks everything that finished since the
    # previous successful run of this workflow, so nothing is missed or
    # reported twice.
    - cron: '0 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rocm_infra_monitor.yml'
      - 'build_tools/rocm/get_last_pipeline_run.sh'
      - 'build_tools/rocm/get_monitoring_window.sh'
      - 'build_tools/rocm/get_runs_since.sh'
      - 'build_tools/rocm/collect_run_failures.sh'
      - 'build_tools/rocm/create_infra_error_issue.sh'

jobs:
  monitor:
    name: Monitor ROCm Nightly Failures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'rocm-dev-infra' }}
          persist-credentials: false

      - name: Determine monitoring window
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(build_tools/rocm/get_monitoring_window.sh \
            "${GITHUB_REPOSITORY}" "${SELF_WORKFLOW}" "${GITHUB_RUN_ID}")
          echo "Reporting runs that finished after: $CUTOFF"
          echo "cutoff=$CUTOFF" >> "$GITHUB_OUTPUT"

      - name: List runs finished since then
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Monitoring $MONITORED_WORKFLOW in $MONITORED_REPO"
          build_tools/rocm/get_runs_since.sh \
            "${MONITORED_REPO}" "${MONITORED_WORKFLOW}" "${{ steps.window.outputs.cutoff }}" \
            > run_ids.txt
          echo "Found $(wc -l < run_ids.txt) runs to check"
          cat run_ids.txt

      - name: Collect failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f failed_runs.txt
          touch failed_runs.txt

          while read -r RUN_ID; do
            [ -z "$RUN_ID" ] && continue

            echo "Checking run ${RUN_ID}"
            FAILURES=$(build_tools/rocm/collect_run_failures.sh "${MONITORED_REPO}" "${RUN_ID}")

            if [ -n "$FAILURES" ]; then
              echo "$FAILURES"
              {
                echo "https://github.com/${MONITORED_REPO}/actions/runs/${RUN_ID}"
                echo "$FAILURES"
                echo ""
              } >> failed_runs.txt
            else
              echo "  -> no reportable failures"
            fi
          done < run_ids.txt

      - name: Create or update issue for failed runs
        if: hashFiles('failed_runs.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s failed_runs.txt ]; then
            build_tools/rocm/create_infra_error_issue.sh \
              failed_runs.txt \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "No failures found, skipping issue creation"
          fi
