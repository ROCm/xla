name: ROCm Infrastructure Error Monitor
permissions:
  actions: read
  contents: read
  issues: write

on:
  schedule:
    # Run every hour to check failed runs from last 2 hours
    - cron: '0 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rocm_infra_monitor.yml'
      - 'build_tools/rocm/analyze_bep_infra_errors.py'
      - 'build_tools/rocm/monitor_bep_artifacts.sh'
      - 'build_tools/rocm/create_infra_error_issue.sh'

jobs:
  monitor:
    name: Monitor ${{ matrix.job_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workflow_file: rocm_ci.yml
            job_name: XLA ROCm CI
            artifact_name: xla-bep
          - workflow_file: rocm_ci.yml
            job_name: JAX ROCm CI
            artifact_name: jax-bep
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'rocm-dev-infra' }}
          persist-credentials: false

      - name: Fetch recent ROCm CI workflow runs
        id: fetch_runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Monitor openxla/xla repository for failed ROCm CI runs
          MONITORED_REPO="openxla/xla"
          WORKFLOW_FILE="${{ matrix.workflow_file }}"
          ARTIFACT_NAME="${{ matrix.artifact_name }}"
          echo "Monitoring repository: $MONITORED_REPO"
          echo "Workflow file: $WORKFLOW_FILE"
          echo "Artifact name: $ARTIFACT_NAME"

          # Get current time from GitHub API (no dependency on runner's clock)
          GITHUB_TIME=$(gh api /rate_limit | jq -r '.resources.core.reset' | xargs -I {} date -u -d '@{}' '+%Y-%m-%dT%H:%M:%SZ')
          echo "GitHub API time: $GITHUB_TIME"

          # Calculate cutoff: 2 hours before GitHub's current time (temporary for testing)
          CUTOFF_TIME=$(date -u -d "$GITHUB_TIME - 2 hours" '+%Y-%m-%dT%H:%M:%SZ')
          echo "Checking for failed runs after: $CUTOFF_TIME"

          # Get failed ROCm CI workflow runs from the last 2 hours
          # Using created filter to ensure we get recent runs
          # Using --paginate to get ALL runs, not just first page
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${MONITORED_REPO}/actions/workflows/${WORKFLOW_FILE}/runs?status=completed&conclusion=failure&created=>${CUTOFF_TIME}&per_page=100" \
            | jq -r '.workflow_runs[] | .id' \
            > run_ids.txt

          echo "Found $(wc -l < run_ids.txt) failed runs from last 2 hours in ${MONITORED_REPO}"
          cat run_ids.txt

      - name: Download BEP artifacts
        if: hashFiles('run_ids.txt') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONITORED_REPO="openxla/xla"
          ARTIFACT_NAME="${{ matrix.artifact_name }}"

          if [ ! -s run_ids.txt ]; then
            echo "No failed runs to check, exiting early"
            exit 0
          fi

          build_tools/rocm/monitor_bep_artifacts.sh run_ids.txt "${MONITORED_REPO}" "${ARTIFACT_NAME}" || true

      - name: Analyze BEP files for infrastructure errors
        id: analyze
        run: |
          if [ ! -d "bep-files" ]; then
            echo "No BEP files downloaded"
            echo "has_infra_errors=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HAS_INFRA_ERRORS=false
          rm -f failed_runs.txt runs_with_bep.txt
          touch failed_runs.txt runs_with_bep.txt

          for run_dir in bep-files/run-*; do
            [ ! -d "$run_dir" ] && continue

            RUN_ID=$(basename "$run_dir" | sed 's/run-//')

            # Track that this run has BEP files (Bazel ran)
            echo "$RUN_ID" >> runs_with_bep.txt

            FOUND_INFRA_ERROR=false

            for bep_file in "$run_dir"/*.json; do
              [ ! -f "$bep_file" ] && continue

              echo "Analyzing $bep_file"
              set +e
              OUTPUT=$(python3 build_tools/rocm/analyze_bep_infra_errors.py "$bep_file" 2>&1)
              EXIT_CODE=$?
              set -e

              # Exit codes: 0=no error, 1=infra error, 2=build/test error
              if [ $EXIT_CODE -eq 1 ]; then
                echo "  -> Infrastructure error detected: $OUTPUT"
                FOUND_INFRA_ERROR=true
                break  # Found infra error, no need to check other BEP files
              elif [ $EXIT_CODE -eq 2 ]; then
                echo "  -> Build/test error (not infrastructure)"
                # Don't break - continue checking other BEP files in case they have infra errors
              else
                echo "  -> No errors detected"
              fi
            done

            if [ "$FOUND_INFRA_ERROR" = true ]; then
              echo "https://github.com/openxla/xla/actions/runs/${RUN_ID}" >> failed_runs.txt
              HAS_INFRA_ERRORS=true
            fi
          done

          if [ "$HAS_INFRA_ERRORS" = true ]; then
            echo "has_infra_errors=true" >> "$GITHUB_OUTPUT"
            echo "Runs with Bazel infrastructure errors:"
            cat failed_runs.txt
          else
            echo "has_infra_errors=false" >> "$GITHUB_OUTPUT"
            echo "No Bazel infrastructure errors found in BEP files"
          fi

      - name: Report non-Bazel infrastructure errors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only report runs that DON'T have BEP files (failed before Bazel ran)
          echo "Checking for non-Bazel infrastructure errors..."

          MONITORED_REPO="openxla/xla"

          if [ -s run_ids.txt ]; then
            while read -r RUN_ID; do
              # Check if this run has BEP files
              if ! grep -q "^${RUN_ID}$" runs_with_bep.txt 2>/dev/null; then
                # Verify this is actually a failure (API query might have race conditions)
                RUN_INFO=$(gh api "/repos/${MONITORED_REPO}/actions/runs/${RUN_ID}")
                CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')

                if [ "$CONCLUSION" != "failure" ]; then
                  echo "Run $RUN_ID has conclusion '$CONCLUSION' (not a failure, skipping)"
                  continue
                fi

                # No BEP files = failed before Bazel = non-Bazel infra error
                echo "Non-Bazel infrastructure error: run $RUN_ID (no BEP files)"
                echo "https://github.com/openxla/xla/actions/runs/${RUN_ID}" >> failed_runs.txt
              fi
            done < run_ids.txt
          fi

      - name: Create or update issue for failed runs
        if: hashFiles('failed_runs.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only create/update issue if there are actual failures
          if [ -s failed_runs.txt ]; then
            build_tools/rocm/create_infra_error_issue.sh \
              failed_runs.txt \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "No infrastructure errors found, skipping issue creation"
          fi
