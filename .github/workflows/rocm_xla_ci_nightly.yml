name: CI ROCm Nightly

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      run_sanitizers:
        description: 'Also run the sanitizers jobs'
        required: false
        type: boolean
        default: false
  schedule:
    # Main XLA UT + JAX run: every 6 hours at :47 (even hours UTC)
    - cron: '47 */6 * * *'
    # Daily run at 03:47 UTC. The hour is odd, so it never coincides with the
    # even-hour entry above (two matching entries would start two runs).
    # This is the only schedule that also triggers the sanitizers job.
    - cron: '47 3 * * *'
  pull_request_target:
    types: [labeled]
  pull_request:
    branches:
      - rocm-dev-infra
    paths:
      - '.github/workflows/rocm_xla_ci_nightly.yml'
      - '.github/workflows/rocm_xla_ci_sanitizers.yml'
      - '.github/workflows/rocm_xla_ci_jax.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rocm-config:
    runs-on: ubuntu-latest
    outputs:
      docker-image: ${{ steps.out.outputs.docker-image }}
      therock-version: ${{ steps.therock.outputs.therock_version }}
    steps:
      - id: out
        shell: bash
        run: |
          echo "docker-image=ghcr.io/rocm/jax-build-ubu24.rocmless@sha256:68854ed30b800d3e8c390f6e651721e2bead58830da1c59e1b828354eb8f077f" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openxla/xla
          ref: main
          sparse-checkout: |
            build_tools/rocm
          persist-credentials: false

      - name: Fetch theRock version detection from ROCm/xla
        run: |
          wget -O build_tools/rocm/detect-therock-version.sh "https://raw.githubusercontent.com/ROCm/xla/refs/heads/rocm-dev-infra/build_tools/rocm/detect-therock-version.sh"
          chmod +x build_tools/rocm/detect-therock-version.sh

      - name: Detect latest TheRock version
        id: therock
        env:
          ROCM_PIP_SOURCE: prerelease
          GPU_TARGET: device-all
          ROCM_SDK_VERSION: '10.2'
          PIP_INDEX_PATH: ''
          THEROCK_INDEX_URL: 'https://rc.repo.amd.com/rocm/whl-next/'
        run: bash build_tools/rocm/detect-therock-version.sh

  execute-xla-ut-nightly:
    needs: rocm-config
    # Run on schedule, workflow_dispatch, "nightly-pipeline" label, or PR to rocm-dev-infra with workflow changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'nightly-pipeline' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'rocm-dev-infra')
    runs-on: ${{ matrix.mode.runner }}
    env:
      COMMON_ARGS: >-
        --config=rocm_ci_hermetic
        --config=${{ matrix.mode.rbe_config }}
        --local_test_jobs=1
        --repo_env=TF_ROCM_RBE_SINGLE_GPU_POOL=linux_x64_gpu
        --repo_env=TF_ROCM_RBE_MULTI_GPU_POOL=default
        --repo_env=TF_ROCM_AMDGPU_TARGETS=gfx950
        --repo_env=TF_ROCM_RBE_DOCKER_IMAGE=${{ needs.rocm-config.outputs.docker-image }}
        --bes_keywords=xla
        --bes_keywords=nightly
        --keep_going
        --nocache_test_results
      ROCM_DISTRO_ARGS: >-
        --repo_env=ROCM_PATH=
        --repo_env=ROCM_DISTRO_URL=${{ matrix.mode.distro_url }}
        --repo_env=ROCM_DISTRO_HASH=${{ matrix.mode.distro_hash }}
    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: "therock_release"
            distro_url: "https://rocm.devreleases.amd.com/tarball-multi-arch/therock-dist-linux-multiarch-10.0.0.dev0%2Bc247febed686e713051e4cf7bcce437a8dcbfad9.tar.gz"
            distro_hash: "1c5beccd46d06ae9b68602b955eae9f4ddf5b0dbb561e521c8040a1c87b1c555"
            runner: "amd-do-linux-xla-gpu-gfx950-dpx-1-testv2"
            rbe_config: "rocm_rbe"
          - name: "therock_nightly"
            distro_url: "https://rc.repo.amd.com/rocm/core/tarball/therock-dist-linux-multiarch-${{ needs.rocm-config.outputs.therock-version }}.tar.gz"
            distro_hash: "no_hash"
            runner: "amd-do-linux-xla-gpu-gfx950-dpx-1-testv2"
            rbe_config: "rocm_rbe"
          - name: "therock_release_bb"
            distro_url: "https://rocm.devreleases.amd.com/tarball-multi-arch/therock-dist-linux-multiarch-10.0.0.dev0%2Bc247febed686e713051e4cf7bcce437a8dcbfad9.tar.gz"
            distro_hash: "1c5beccd46d06ae9b68602b955eae9f4ddf5b0dbb561e521c8040a1c87b1c555"
            runner: "amd-do-linux-xla-gpu-gfx950-dpx-1-testv2"
            rbe_config: "rocm_rbe_dev"
    container:
      image: ${{ needs.rocm-config.outputs.docker-image }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This workflow runs against the upstream XLA source tree.
          repository: openxla/xla
          ref: main
          persist-credentials: false

      - name: Populate missing upstream ROCm build tools
        if: ${{ hashFiles('build_tools/rocm/run_xla_ci_build.sh') == '' }}
        run: |
          tmpdir="$(mktemp -d)"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/openxla/xla.git "$tmpdir"
          git -C "$tmpdir" sparse-checkout set build_tools/rocm
          cp -a "$tmpdir/build_tools/rocm/." build_tools/rocm/

      - name: CPU Info
        run: lscpu

      - name: ROCm info
        run: |
          if command -v rocminfo >/dev/null 2>&1; then
            "$(command -v rocminfo)"
          elif [ -x /opt/rocm/bin/rocminfo ]; then
            /opt/rocm/bin/rocminfo
          else
            echo "rocminfo not found in this container image; skipping diagnostic step."
          fi

      - name: Test XLA [${{ matrix.mode.name }}] [single_gpu]
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            --config=rocm_rbe_dynamic \
            --config=ci_single_gpu \
            --local_test_jobs=1 \
            --jobs=30 \
            --spawn_strategy=local \
            --bes_keywords=single_gpu \
            --build_event_json_file=xla_${{ matrix.mode.name }}_single_gpu_build_events.json \
            ${COMMON_ARGS} \
            ${ROCM_DISTRO_ARGS} \
            -- \
            //xla/...

      - name: Test XLA [${{ matrix.mode.name }}] [multi_gpu]
        if: always() && !cancelled()
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            --config=ci_multi_gpu \
            --local_test_jobs=1 \
            --test_strategy=exclusive \
            --bes_keywords=multi_gpu \
            --build_event_json_file=xla_${{ matrix.mode.name }}_multi_gpu_build_events.json \
            ${COMMON_ARGS} \
            ${ROCM_DISTRO_ARGS} \
            --spawn_strategy=local \
            --strategy=TestRunner=local \
            -- \
            //xla/...

      - name: Test XLA [${{ matrix.mode.name }}] [rocm_cpu]
        if: always() && !cancelled()
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            --config=rocm_rbe_dynamic \
            --config=ci_rocm_cpu \
            --local_test_jobs=70 \
            --bes_keywords=cpu \
            --build_event_json_file=xla_${{ matrix.mode.name }}_rocm_cpu_build_events.json \
            ${COMMON_ARGS} \
            ${ROCM_DISTRO_ARGS} \
            --spawn_strategy=local \
            -- \
            //xla/...

      # Consumed by .github/workflows/rocm_infra_monitor.yml to tell
      # infrastructure failures apart from genuine build/test failures.
      - name: Upload XLA BEP Files
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: xla-bep-${{ matrix.mode.name }}
          path: xla_${{ matrix.mode.name }}_*_build_events.json
          if-no-files-found: warn

  # Call sanitizers workflow as a separate job.
  # Always on the daily cron (not the 2-hourly one), on the "nightly-pipeline"
  # label, or on PRs to rocm-dev-infra touching the workflows. On a manual run
  # only when the run_sanitizers input is checked (it defaults to off).
  sanitizers:
    if: >-
      github.event.schedule == '47 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_sanitizers) ||
      github.event.label.name == 'nightly-pipeline' ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'rocm-dev-infra')
    uses: ./.github/workflows/rocm_xla_ci_sanitizers.yml
    with:
      repository: openxla/xla
      ref: main
      run_sanitizers: true

  # Call JAX upstream workflow as a separate job (runs on every trigger, i.e. every 2 hours)
  jax-upstream:
    uses: ./.github/workflows/rocm_xla_ci_jax.yml
    with:
      repository: openxla/xla
      ref: main
      run_jax: true
