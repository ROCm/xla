name: CI ROCm Nightly

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Run every 24 hours at 3:47 AM UTC
    - cron: '47 3 * * *'
  pull_request_target:
    types: [labeled]
  pull_request:
    branches:
      - rocm-dev-infra
    paths:
      - '.github/workflows/rocm_xla_ci_nightly.yml'
      - '.github/workflows/rocm_xla_ci_sanitizers.yml'
      - '.github/workflows/rocm_xla_ci_jax.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci-metrics:
    # Run on schedule, workflow_dispatch, "nightly-pipeline" label, or PR to rocm-dev-infra with workflow changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'nightly-pipeline' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'rocm-dev-infra')
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the report and data branches back to this repository.
      contents: write
    env:
      # ci-metrics/*.py and the `gh` CLI both read GH_TOKEN. GITHUB_TOKEN is
      # limited to 1000 API requests/hour/repo, which a one-day window fits into;
      # set a CI_METRICS_TOKEN secret (public-repo read scope) to get the full
      # 5000/hour budget if the window is ever widened.
      GH_TOKEN: ${{ secrets.CI_METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      REPORT_BRANCH: ci-metrics-reports
      DATA_BRANCH: ci-metrics-data
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Unlike the test jobs, this one runs the ci-metrics scripts that live
          # in *this* repository, not in the upstream XLA tree.
          persist-credentials: false

      - name: Set up the one-day collection window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          # Current time yesterday .. current time today, in UTC.
          until_ts="$(date -u +%Y-%m-%dT%H:%M:%S)"
          since_ts="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%S)"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "since=$since_ts"   >> "$GITHUB_OUTPUT"
          echo "until=$until_ts"   >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp"      >> "$GITHUB_OUTPUT"
          echo "Collecting ${since_ts}Z .. ${until_ts}Z (stamp $stamp)"

      - name: Collect runs, jobs and step timings
        working-directory: ci-metrics
        run: |
          python3 collect.py \
            --since "${{ steps.window.outputs.since }}" \
            --until "${{ steps.window.outputs.until }}" \
            --out "$RUNNER_TEMP/data/${{ steps.window.outputs.stamp }}"

      - name: Fetch earlier attempts of re-run jobs
        working-directory: ci-metrics
        run: python3 fetch_attempts.py --data "$RUNNER_TEMP/data/${{ steps.window.outputs.stamp }}"

      - name: Sample job logs for test counts and critical path
        working-directory: ci-metrics
        run: python3 sample_logs.py --data "$RUNNER_TEMP/data/${{ steps.window.outputs.stamp }}"

      - name: Render the HTML report
        working-directory: ci-metrics
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 report.py \
            --data "$RUNNER_TEMP/data/${{ steps.window.outputs.stamp }}" \
            --since "${{ steps.window.outputs.since }}" \
            --until "${{ steps.window.outputs.until }}" \
            --html "$RUNNER_TEMP/out/ci-metrics-${{ steps.window.outputs.stamp }}.html"

      - name: Push the report to the ${{ env.REPORT_BRANCH }} branch
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAMP: ${{ steps.window.outputs.stamp }}
          SINCE: ${{ steps.window.outputs.since }}
          UNTIL: ${{ steps.window.outputs.until }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/publish-report"
          rm -rf "$work" && mkdir -p "$work" && cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin "$REPORT_BRANCH"; then
            git checkout -q -b "$REPORT_BRANCH" FETCH_HEAD
          else
            echo "$REPORT_BRANCH does not exist yet; creating it"
            git checkout -q -b "$REPORT_BRANCH"
          fi
          mkdir -p reports
          cp "$RUNNER_TEMP/out/ci-metrics-${STAMP}.html" reports/
          git add -A reports
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -q -m "ci-metrics report ${STAMP} (${SINCE}Z..${UNTIL}Z)"
            git push -q origin "$REPORT_BRANCH"
          fi

      - name: Push the collected data to the ${{ env.DATA_BRANCH }} branch
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAMP: ${{ steps.window.outputs.stamp }}
          SINCE: ${{ steps.window.outputs.since }}
          UNTIL: ${{ steps.window.outputs.until }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/publish-data"
          rm -rf "$work" && mkdir -p "$work" && cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin "$DATA_BRANCH"; then
            git checkout -q -b "$DATA_BRANCH" FETCH_HEAD
          else
            echo "$DATA_BRANCH does not exist yet; creating it"
            git checkout -q -b "$DATA_BRANCH"
          fi
          mkdir -p "data/${STAMP}"
          cp -a "$RUNNER_TEMP/data/${STAMP}/." "data/${STAMP}/"
          git add -A data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -q -m "ci-metrics data ${STAMP} (${SINCE}Z..${UNTIL}Z)"
            git push -q origin "$DATA_BRANCH"
          fi

  rocm-config:
    runs-on: ubuntu-latest
    outputs:
      docker-image: ${{ steps.out.outputs.docker-image }}
      therock-version: ${{ steps.therock.outputs.therock_version }}
    steps:
      - id: out
        shell: bash
        run: |
          echo "docker-image=ghcr.io/rocm/jax-build-ubu24.rocmless@sha256:68854ed30b800d3e8c390f6e651721e2bead58830da1c59e1b828354eb8f077f" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openxla/xla
          ref: main
          sparse-checkout: |
            build_tools/rocm
          persist-credentials: false

      - name: Fetch theRock version detection from ROCm/xla
        run: |
          wget -O build_tools/rocm/detect-therock-version.sh "https://raw.githubusercontent.com/ROCm/xla/refs/heads/rocm-dev-infra/build_tools/rocm/detect-therock-version.sh"
          chmod +x build_tools/rocm/detect-therock-version.sh

      - name: Detect latest TheRock version
        id: therock
        env:
          ROCM_PIP_SOURCE: nightlies
          GPU_TARGET: device-all
          ROCM_SDK_VERSION: '10.2'
          PIP_INDEX_PATH: ''
          THEROCK_INDEX_URL: 'https://nightly.repo.amd.com/rocm/whl-next/'
        run: bash build_tools/rocm/detect-therock-version.sh

  execute-xla-ut-nightly:
    needs: rocm-config
    # Run on schedule, workflow_dispatch, "nightly-pipeline" label, or PR to rocm-dev-infra with workflow changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'nightly-pipeline' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'rocm-dev-infra')
    runs-on: ${{ matrix.mode.runner }}
    env:
      COMMON_ARGS: >-
        --config=rocm_ci_hermetic
        --config=rocm_rbe_dev
        --local_test_jobs=1
        --repo_env=TF_ROCM_RBE_SINGLE_GPU_POOL=linux_x64_gpu
        --repo_env=TF_ROCM_RBE_MULTI_GPU_POOL=default
        --repo_env=TF_ROCM_AMDGPU_TARGETS=gfx950
        --repo_env=TF_ROCM_RBE_DOCKER_IMAGE=${{ needs.rocm-config.outputs.docker-image }}
        --bes_keywords=xla
        --bes_keywords=nightly
        --keep_going
      ROCM_DISTRO_ARGS: >-
        --repo_env=ROCM_PATH=
        --repo_env=ROCM_DISTRO_URL=${{ matrix.mode.distro_url }}
        --repo_env=ROCM_DISTRO_HASH=${{ matrix.mode.distro_hash }}
    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: "therock_release"
            distro_url: "https://stable.repo.amd.com/rocm/core/tarball/therock-dist-linux-multiarch-10.1.0.tar.gz"
            distro_hash: "a95c72f0052168f2262365dff71c2259331721ad0a65da7957dc7d96ccb77021"
            runner: "amd-do-linux-xla-gpu-gfx950-dpx-4"
          - name: "therock_nightly"
            distro_url: "https://nightly.repo.amd.com/rocm/core/tarball/therock-dist-linux-multiarch-${{ needs.rocm-config.outputs.therock-version }}.tar.gz"
            distro_hash: "no_hash"
            runner: "amd-do-linux-xla-gpu-gfx950-dpx-4"
    container:
      image: ${{ needs.rocm-config.outputs.docker-image }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This workflow runs against the upstream XLA source tree.
          repository: openxla/xla
          ref: main
          persist-credentials: false

      - name: Populate missing upstream ROCm build tools
        if: ${{ hashFiles('build_tools/rocm/run_xla_ci_build.sh') == '' }}
        run: |
          tmpdir="$(mktemp -d)"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/openxla/xla.git "$tmpdir"
          git -C "$tmpdir" sparse-checkout set build_tools/rocm
          cp -a "$tmpdir/build_tools/rocm/." build_tools/rocm/

      - name: CPU Info
        run: lscpu

      - name: ROCm info
        run: |
          if command -v rocminfo >/dev/null 2>&1; then
            "$(command -v rocminfo)"
          elif [ -x /opt/rocm/bin/rocminfo ]; then
            /opt/rocm/bin/rocminfo
          else
            echo "rocminfo not found in this container image; skipping diagnostic step."
          fi

      - name: Test XLA [${{ matrix.mode.name }}] [single_gpu]
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            --config=rocm_rbe_dynamic \
            --config=ci_single_gpu \
            --local_test_jobs=1 \
            --jobs=30 \
            --spawn_strategy=local \
            --bes_keywords=single_gpu \
            ${COMMON_ARGS} \
            ${ROCM_DISTRO_ARGS} \
            -- \
            //xla/...

      - name: Test XLA [${{ matrix.mode.name }}] [multi_gpu]
        if: always() && !cancelled()
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            --config=ci_multi_gpu \
            --local_test_jobs=1 \
            --test_strategy=exclusive \
            --bes_keywords=multi_gpu \
            ${COMMON_ARGS} \
            ${ROCM_DISTRO_ARGS} \
            --spawn_strategy=local \
            --strategy=TestRunner=local \
            -- \
            //xla/...

      - name: Test XLA [${{ matrix.mode.name }}] [rocm_cpu]
        if: always() && !cancelled()
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            --config=rocm_rbe_dynamic \
            --config=ci_rocm_cpu \
            --local_test_jobs=70 \
            --bes_keywords=cpu \
            ${COMMON_ARGS} \
            ${ROCM_DISTRO_ARGS} \
            --spawn_strategy=local \
            -- \
            //xla/...

  # Call sanitizers workflow as a separate job
  sanitizers:
    uses: ./.github/workflows/rocm_xla_ci_sanitizers.yml
    with:
      repository: openxla/xla
      ref: main
      run_sanitizers: true

  # Call JAX upstream workflow as a separate job
  jax-upstream:
    uses: ./.github/workflows/rocm_xla_ci_jax.yml
    with:
      repository: openxla/xla
      ref: main
      run_jax: true
