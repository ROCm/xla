# ============================================================================
#
# Shared by every caller of claude_issue_triage.yml that passes an
# `artifact_name` (today: rocm_infra_agent.yml's `respond_to_mention` and
# rocm_infra_monitor.yml's `auto_verify`): downloads whatever patch that
# call produced (if any - most runs produce nothing, since most reports
# are "not applicable" or purely investigative) and, only if one exists,
# applies it to the exact commit it was generated against, pushes it to
# ROCm/xla, and opens a draft PR. Deterministic, not agent-run: the skill
# that produced the patch never commits/pushes/opens a PR itself (Claude
# Code's own Bash permission check rejects any command referencing a
# credential it can't verify ahead of time), so this plain-shell job does
# all of that instead, entirely outside the agent.
#
# Downstream (default) vs. upstream (by request): if the skill wrote
# /tmp/claude_pr_target.txt containing "upstream" - which it only does when
# a human explicitly asked for the fix to be sent to openxla/xla, not just
# ROCm/xla - and `commenter_login` is non-empty, the commit is attributed to
# that GitHub user (name/email resolved below) instead of github-actions[bot]
# so openxla/xla's CLA bot recognizes it. The branch is still pushed to
# ROCm/xla exactly as always (no credential exists that can push to or open
# a PR against openxla/xla directly - see the "Apply verified patch" step),
# but a pre-filled GitHub compare URL is posted on the issue instead of an
# already-opened PR, for a human to finish with one click.

name: Claude Apply Patch

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repo the verified commit lives in (almost always openxla/xla)'
        required: true
        type: string
      head_sha:
        description: 'The exact commit the patch was generated against'
        required: true
        type: string
      issue_number:
        description: 'Per-failure issue to post the draft PR link back into, once opened'
        required: true
        type: string
      artifact_name:
        description: 'Name the patch (if any) was uploaded under by claude_issue_triage.yml'
        required: true
        type: string
      commenter_login:
        description: 'GitHub login of whoever asked for this (empty for the fully-automatic auto_verify flow, which has no human requester). Only used if the skill explicitly asked for an upstream PR (/tmp/claude_pr_target.txt says "upstream") - see the "Apply verified patch" step for why an empty value always forces a downstream PR regardless of that file.'
        required: true
        type: string

jobs:
  apply:
    name: "Apply fix: ${{ inputs.artifact_name }}"
    runs-on: ubuntu-latest
    # Needs to push a branch and open a draft PR - scoped here (the
    # calling job's own `permissions:` block), not at the workflow level,
    # same as every other elevated-permission job in this pipeline.
    timeout-minutes: 15
    steps:
      # continue-on-error, not an `if-no-files-found`-style flag: there's
      # no download-side equivalent, so a missing artifact just fails this
      # one step, which is exactly what "nothing to apply" looks like -
      # most runs of the skill that might have produced this artifact
      # report "not applicable" or a purely investigative finding, with no
      # patch at all. The file-existence check right below treats a failed
      # download identically to the artifact having been found empty.
      - name: Download patch artifact, if one was produced
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp

      # The default GITHUB_TOKEN cannot push a brand-new branch into
      # ROCm/xla: creating a ref requires GitHub to validate whether it
      # introduces/changes anything under .github/workflows/* - a check
      # that needs a "workflows" permission scope the standard Actions
      # token can never carry, regardless of what this job's own
      # `permissions:` block grants (there is no such scope available to
      # it). This bit us for real: the first live verify run got
      # everything right (red->green->red) but failed to push with `POST
      # /git/refs` -> 403 "Resource not accessible by integration" /
      # "workflows scope may be required" - even though the fix itself
      # never touched a workflow file, because that check applies to any
      # brand-new ref, not just to the commit's own diff. Same root cause
      # sync_main_mirror.yml already works around with a scoped GitHub App
      # token - request only `contents`+`workflows` here, the exact same
      # pair that token already works with there. Asking this App token
      # for anything more (pull-requests, issues) fails outright: the
      # installation itself was only ever granted a specific, narrower
      # permission set, and GitHub validates a token request's scopes
      # against that atomically - if even one requested scope exceeds what
      # the installation has, the whole request is rejected with a 422
      # ("level of access... not granted to this installation"), which is
      # exactly what requesting pull-requests/issues on top of this hit.
      # `gh pr create` doesn't need this token anyway: opening a PR against
      # an already-pushed branch is a plain pull-requests:write operation
      # with no workflows-scope involved, and the calling job's own
      # `permissions:` block already grants that to the default
      # GITHUB_TOKEN - so only the one `git push` below uses this App
      # token, everything else (comment edits, the PR itself) keeps using
      # the default one.
      - name: Create GitHub App token for the branch push only
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ROCM_REPO_MANAGEMENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROCM_REPO_MANAGEMENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      # Configuring this here (a plain workflow step, not an agent Bash
      # tool call) rather than inside the skill matters: Claude Code's own
      # Bash tool refuses to run any command referencing a credential it
      # can't verify is safe before running it, even one injected via
      # `env:` - confirmed in production, embedding a token directly in a
      # skill's own `git remote add ...` command got rejected outright ("A
      # variable in braces in this command can't be checked before it
      # runs"). That's exactly why no skill in this pipeline pushes or
      # opens a PR itself - it only ever writes a patch file for this job
      # to use. Any `git push`/`git remote add .../ROCm/xla.git` from here
      # on in this job is transparently authenticated without any token,
      # or any variable at all, appearing in anyone's command text.
      - name: Configure git to authenticate pushes to ROCm/xla
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/ROCm/xla.git".insteadOf "https://github.com/ROCm/xla.git"

      - name: Apply verified patch and open PR
        id: open_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -s /tmp/claude_fix.patch ]; then
            echo "No verified fix to apply - skipping."
            exit 0
          fi

          # Derived purely from this step's two real inputs - the commit
          # and the patch - rather than from job/step name metadata: the
          # patch hash disambiguates two different verified fixes landing
          # on the same commit (two unrelated failures at the same
          # head_sha), which a job/step slug would do too, but this way
          # the branch name has no dependency on anything beyond what this
          # step actually consumes.
          SHA_SHORT=$(echo "${{ inputs.head_sha }}" | cut -c1-7)
          PATCH_HASH=$(sha256sum /tmp/claude_fix.patch | cut -c1-8)
          BRANCH="claude/verify-fix/${SHA_SHORT}-${PATCH_HASH}"

          # Base the fix on the exact commit the skill that produced this
          # patch actually tested (inputs.repository@inputs.head_sha - the
          # same commit claude_issue_triage.yml's "Checkout the commit
          # that failed" step checked out), not on any branch tip. The
          # red->green->red cycle that produced it only proves the fix
          # works against that one commit - rebasing onto a later tip
          # (ROCm/xla's or even openxla/xla's own main) would ship
          # something that was never actually verified. GitHub allows
          # fetching an arbitrary commit SHA directly (no need to walk
          # main's history to find it), and since head_sha only gets older
          # relative to ROCm/xla's main (kept in sync by sync_upstream.yml)
          # the push below is normally pushing a commit the remote already
          # has as an ancestor, not a fresh tip it might not have caught
          # up to yet.
          WORKDIR=$(mktemp -d)
          git -C "$WORKDIR" init -q
          git -C "$WORKDIR" remote add upstream "https://github.com/${{ inputs.repository }}.git"
          git -C "$WORKDIR" fetch -q --depth=1 upstream "${{ inputs.head_sha }}"
          git -C "$WORKDIR" checkout -q -b "$BRANCH" FETCH_HEAD

          if ! git -C "$WORKDIR" apply --check /tmp/claude_fix.patch; then
            echo "::warning::Verified patch no longer applies cleanly to ${{ inputs.head_sha }} - needs a manual rebase"
            exit 0
          fi
          git -C "$WORKDIR" apply /tmp/claude_fix.patch

          # Upstream only if the skill explicitly asked for it (wrote this
          # exact file) AND there's an actual requester to attribute the
          # commit to - an empty commenter_login (the auto_verify flow has
          # no human requester at all) always forces downstream, even if
          # the file is somehow present, since there'd be nobody legitimate
          # to credit.
          TARGET="downstream"
          if [ -s /tmp/claude_pr_target.txt ] && [ -n "${{ inputs.commenter_login }}" ] \
              && [ "$(tr -d '[:space:]' < /tmp/claude_pr_target.txt)" = "upstream" ]; then
            TARGET="upstream"
          fi

          COMMIT_NAME="github-actions[bot]"
          COMMIT_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$TARGET" = "upstream" ]; then
            LOGIN="${{ inputs.commenter_login }}"
            # Resolve the requester's own identity so the commit is theirs
            # for openxla/xla's CLA bot, not github-actions[bot]'s: their
            # public profile email if they have one set, else GitHub's own
            # noreply alias for their account (always available, and is
            # exactly how GitHub itself associates an email-less commit with
            # an account).
            if USER_JSON=$(gh api "users/${LOGIN}"); then
              USER_ID=$(printf '%s' "$USER_JSON" | jq -r '.id')
              PUBLIC_EMAIL=$(printf '%s' "$USER_JSON" | jq -r '.email // empty')
              DISPLAY_NAME=$(printf '%s' "$USER_JSON" | jq -r '.name // empty')
              COMMIT_NAME="${DISPLAY_NAME:-$LOGIN}"
              COMMIT_EMAIL="${PUBLIC_EMAIL:-${USER_ID}+${LOGIN}@users.noreply.github.com}"
            else
              echo "::warning::Could not resolve GitHub user '${LOGIN}' - falling back to a downstream PR instead of an upstream one"
              TARGET="downstream"
            fi
          fi

          git -C "$WORKDIR" \
            -c user.name="$COMMIT_NAME" \
            -c user.email="$COMMIT_EMAIL" \
            commit -aq -F /tmp/claude_pr_title.txt

          # Always pushes to ROCm/xla regardless of $TARGET - there is no
          # credential that can push to, or open a PR against, openxla/xla
          # itself (see the App-token step above), so an "upstream" request
          # still lands this same branch in ROCm/xla, just handed off
          # differently below.
          git -C "$WORKDIR" remote add origin https://github.com/ROCm/xla.git
          if ! git -C "$WORKDIR" push -q origin "HEAD:refs/heads/${BRANCH}"; then
            echo "::warning::Failed to push the verified-fix branch to ROCm/xla"
            exit 0
          fi

          if [ "$TARGET" = "upstream" ]; then
            # No credential can call `gh pr create --repo openxla/xla`
            # (GitHub App installation tokens, and the default GITHUB_TOKEN,
            # are both hard-scoped to ROCm/xla) - instead, hand a human a
            # pre-filled compare URL across the fork boundary (ROCm/xla is a
            # registered fork of openxla/xla) to finish with one click. The
            # CLA bot checks the commit's own author/committer, set above,
            # not who clicks "Create pull request", so this still satisfies
            # it.
            TITLE_ENC=$(jq -rn --arg s "$(head -1 /tmp/claude_pr_title.txt)" '$s|@uri')
            BODY_ENC=$(jq -rn --arg s "$(cat /tmp/claude_pr_body.txt)" '$s|@uri')
            echo "target=upstream" >> "$GITHUB_OUTPUT"
            echo "compare_url=https://github.com/openxla/xla/compare/main...ROCm:${BRANCH}?quick_pull=1&title=${TITLE_ENC}&body=${BODY_ENC}" >> "$GITHUB_OUTPUT"
          else
            PR_URL=$(gh pr create --repo ROCm/xla --draft \
              --title "$(head -1 /tmp/claude_pr_title.txt)" \
              --body-file /tmp/claude_pr_body.txt \
              --base main --head "$BRANCH") || {
              echo "::warning::Failed to open the draft PR"
              exit 0
            }
            echo "target=downstream" >> "$GITHUB_OUTPUT"
            echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Post the result as a new comment on the issue
        if: steps.open_pr.outputs.pr_url != '' || steps.open_pr.outputs.compare_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.open_pr.outputs.pr_url }}
          COMPARE_URL: ${{ steps.open_pr.outputs.compare_url }}
          COMMENTER_LOGIN: ${{ inputs.commenter_login }}
        run: |
          set -euo pipefail
          if [ -n "$PR_URL" ]; then
            gh issue comment "${{ inputs.issue_number }}" --repo ROCm/xla \
              --body "[draft PR](${PR_URL}) opened with the fix."
          else
            {
              echo "Pushed a verified fix to a branch on \`ROCm/xla\`, committed as @${COMMENTER_LOGIN} (so openxla/xla's CLA bot recognizes it) - sending this upstream was explicitly requested, and no automation credential can open a PR against \`openxla/xla\` directly, so finishing it needs one human click:"
              echo ""
              echo "[Open the PR against openxla/xla](${COMPARE_URL})"
              echo ""
              echo "Title/body are pre-filled in that link; repeated here in case the prefill doesn't carry over:"
              echo ""
              echo "**$(head -1 /tmp/claude_pr_title.txt)**"
              echo ""
              cat /tmp/claude_pr_body.txt
            } > /tmp/claude_apply_comment.txt
            gh issue comment "${{ inputs.issue_number }}" --repo ROCm/xla \
              --body-file /tmp/claude_apply_comment.txt
          fi
