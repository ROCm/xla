name: CI ROCm Sanitizers

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        description: "Repository to checkout"
        required: false
        type: string
        default: "openxla/xla"
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: "main"
      run_sanitizers:
        description: "Set to true to run sanitizers"
        required: false
        type: boolean
        default: true
  pull_request_target:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_number }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  execute-xla-ut-sanitizers:
    if: inputs.run_sanitizers || github.event.label.name == 'sanitizers'
    runs-on: linux-xla-do-mi350x-8
    env:
      DOCKER_IMAGE: ghcr.io/rocm/jax-build-ubu24.rocmless@sha256:68854ed30b800d3e8c390f6e651721e2bead58830da1c59e1b828354eb8f077f
      COMMON_ARGS: >-
        --config=rocm_ci_hermetic
        --dynamic_mode=off
        --@rules_ml_toolchain//common:enable_xla_test_global_symbol_version=False
        --local_test_jobs=8
        --spawn_strategy=local
        --strategy=TestRunner=local
        --repo_env=TF_ROCM_RBE_SINGLE_GPU_POOL=linux_x64_gpu
        --repo_env=TF_ROCM_RBE_MULTI_GPU_POOL=default
        --repo_env=TF_ROCM_AMDGPU_TARGETS=gfx950
        --repo_env=TF_ROCM_RBE_DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}
        --bes_keywords=xla
        --bes_keywords=sanitizers
    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: "asan"
            configs:
              - "--config=asan"
          - name: "tsan"
            configs:
              - "--config=tsan"
    container:
      image: ghcr.io/rocm/jax-build-ubu24.rocmless@sha256:68854ed30b800d3e8c390f6e651721e2bead58830da1c59e1b828354eb8f077f
      options: >-
        --device=/dev/dri
        --device=/dev/kfd
        --shm-size=16G
        --cap-add=SYS_PTRACE
        --security-opt=seccomp=unconfined
      volumes:
        - /tmp/bazel-cache:/root/.cache/bazel

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name }}
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: CPU Info
        run: lscpu

      - name: Test XLA [${{ matrix.mode.name }}] [single_gpu]
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            ${{ join(matrix.mode.configs, ' ') }} \
            --config=ci_single_gpu \
            ${COMMON_ARGS} \
            --run_under=//build_tools/rocm:sanitizer_wrapper_parallel_gpu_execute
            --repo_env=TF_ROCM_RBE_SINGLE_GPU_POOL=linux_x64_gpu \
            --jobs=30 \
            --bes_keywords=single_gpu \
            -- \
            //xla/...

      - name: Test XLA [${{ matrix.mode.name }}] [multi_gpu]
        if: always() && !cancelled()
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            ${{ join(matrix.mode.configs, ' ') }} \
            --config=ci_multi_gpu \
            ${COMMON_ARGS} \
            --local_test_jobs=1 \
            --bes_keywords=multi_gpu \
            -- \
            //xla/...

      - name: Test XLA [${{ matrix.mode.name }}] [rocm_cpu]
        if: always() && !cancelled()
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            ${{ join(matrix.mode.configs, ' ') }} \
            ${COMMON_ARGS} \
            --config=ci_rocm_cpu \
            --local_test_jobs=10 \
            --bes_keywords=cpu \
            -- \
            //xla/...
