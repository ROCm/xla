# ============================================================================
#
# Split out of rocm_infra_monitor.yml: that pipeline detects/debugs nightly
# CI failures on a schedule and shares no job dependency with this one at
# all. This one instead reacts to a human editing an `@claude <instructions>`
# line into one of those detection comments, asking Claude to act on that
# failure - verify an already-proposed fix, dig further, try a different
# approach, or devise a new solution. Keeping them in one file meant
# cross-cutting `if: github.event_name != 'issue_comment'` gates on the
# unrelated jobs just to keep a skipped job's outputs from reaching
# `fromJson` - a sign they were really two pipelines sharing a file.

name: ROCm Infra Agent
permissions:
  contents: read
  issues: write
  id-token: write  # Required by claude-code-action (respond_to_mention job) for OIDC auth.

env:
  # Branch this run itself is testing/running from, so a PR (or a manual
  # workflow_dispatch against --ref <branch>) exercises its own changes
  # instead of silently falling back to the default branch. github.head_ref
  # is the PR's own branch name on a pull_request event but is empty
  # otherwise; github.ref_name is the branch/tag a workflow_dispatch,
  # schedule, or issue_comment run is actually executing from (always the
  # default branch for those, so no further fallback is needed). Used
  # below both to check out this workflow's own code and, in
  # respond_to_mention, to fetch the matching version of the skill.
  DEBUG_PIPELINE_REF: ${{ github.head_ref || github.ref_name }}

on:
  schedule:
    # Fallback safety net for the issue_comment trigger below: catches an
    # `@claude` line that landed while this never fired (a run that failed
    # to dispatch, GitHub Actions degraded, etc). Offset from
    # rocm_infra_monitor.yml's own ":00" schedule to spread API load rather
    # than both pipelines hitting GitHub at the same wall-clock minute.
    - cron: "15 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/rocm_infra_agent.yml"
      - ".github/workflows/claude_issue_triage.yml"
      - "build_tools/rocm/create_infra_error_issue.sh"
      - "build_tools/rocm/collect_claude_mention_targets.sh"
      - ".claude/skills/respond-to-mention/SKILL.md"
  issue_comment:
    # Fires immediately when someone *edits* an existing comment - not
    # `created`, deliberately: editing someone else's comment requires
    # write/triage access to the repo, so this stays restricted to trusted
    # collaborators. `created` would fire for any comment any logged-in
    # user posts on a public repo, which is a very different (and much
    # wider) trust boundary we're not opting into here.
    types: [edited]

jobs:
  collect_mention_targets:
    # On a schedule/workflow_dispatch run, a human could have edited an
    # `@claude <instructions>` line into a comment analyzed days ago, so
    # that path rescans the whole tracking issue rather than only this
    # window's newly-detected failures - this is the fallback path. An
    # issue_comment event already tells us exactly which comment changed,
    # so that path checks only the one comment - see
    # collect_claude_mention_targets.sh for both modes.
    #
    # The `contains()` check below is a cheap, best-effort pre-filter (it
    # only matches a literal lowercase "@claude", unlike the script's own
    # case-insensitive check) so an issue_comment event for an unrelated
    # edit skips even the checkout - it's fine for this to occasionally
    # under-match an unusual capitalization, since the scheduled full scan
    # still catches anything missed here.
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '@claude')
    name: Find @claude follow-ups to act on
    runs-on: ubuntu-latest
    outputs:
      # A JSON array of {issue_number, comment_id, comment_url, job_name,
      # step_name, repository, head_sha, failure_url, run_id, job_id,
      # instructions, instructions_hash} - one per @claude-instructed
      # comment that hasn't already had this exact instruction acted on.
      # "[]" means nothing to do this run. See
      # collect_claude_mention_targets.sh.
      mention_targets: ${{ steps.collect.outputs.mention_targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEBUG_PIPELINE_REF }}
          persist-credentials: false

      - name: Find the tracking issue and collect @claude follow-ups
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          # Passed via env, never interpolated directly into the script
          # below: COMMENT_BODY is attacker-controlled free text (anyone
          # who can edit a comment controls it), and `${{ }}` substitution
          # into a `run:` block is literal text splicing - embedding it
          # directly would let a comment body break out into arbitrary
          # shell. Env var expansion (`"$COMMENT_BODY"`) is just data, so
          # it's safe however it's shaped.
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          ISSUE_NUMBER=$(build_tools/rocm/create_infra_error_issue.sh)
          if [ "${EVENT_NAME}" = "issue_comment" ]; then
            TARGETS=$(build_tools/rocm/collect_claude_mention_targets.sh \
              "${ISSUE_NUMBER}" --comment "${COMMENT_ID}" "${COMMENT_URL}" "${COMMENT_BODY}")
          else
            TARGETS=$(build_tools/rocm/collect_claude_mention_targets.sh "${ISSUE_NUMBER}")
          fi
          echo "mention_targets=${TARGETS}" >> "$GITHUB_OUTPUT"

  respond_to_mention:
    name: "Respond: ${{ matrix.job_name }} / ${{ matrix.step_name }}"
    needs: collect_mention_targets
    if: needs.collect_mention_targets.outputs.mention_targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.collect_mention_targets.outputs.mention_targets) }}
    uses: ./.github/workflows/claude_issue_triage.yml
    with:
      repository: ${{ matrix.repository }}
      head_sha: ${{ matrix.head_sha }}
      debug_pipeline_ref: ${{ env.DEBUG_PIPELINE_REF }}
      comment_url: ${{ matrix.comment_url }}
      already_handled_marker: "<!-- rocm-nightly-claude-mention:${{ matrix.job_name }} / ${{ matrix.step_name }}:${{ matrix.instructions_hash }} -->"
      claude_step_name: Respond to @claude Mention
      # The skill self-caps its own non-build decision-making at 30 minutes
      # (see SKILL.md) - job_timeout_minutes instead bounds the whole run,
      # including whatever build+test cycles the instruction ends up
      # requiring, which can legitimately take a long while.
      job_timeout_minutes: 180
      claude_timeout_minutes: 175
      max_turns: 100
      allowed_tools: "Skill,Bash(gh issue edit *),Bash(gh label create *),Bash(gh api *),Bash(gh run view *),Bash(git *),Bash(docker exec rocmless-debug *),Bash(build_tools/rocm/*),Bash(bazel *),Bash(gdb *),Bash(objdump *),Bash(grep *),Bash(cat *),Bash(timeout *),Read,Grep,Glob,Write,Edit"
      # Keyed by comment_id (not job/step/instructions_hash): one comment
      # only ever has one instruction in flight at a time, and
      # apply_patch_and_open_pr below computes this exact same name
      # independently (from the same collect_mention_targets output) to
      # find it - they don't need to agree on anything else.
      artifact_name: "mention-patch-${{ matrix.comment_id }}"
      prompt: |
        CI REPO (for job logs / issue comments / where the PR goes): ROCm/xla
        SOURCE REPO (already checked out in the working directory): ${{ matrix.repository }}
        HEAD SHA (already checked out): ${{ matrix.head_sha }}
        NIGHTLY RUN ID: ${{ matrix.run_id }}
        FAILING JOB ID: ${{ matrix.job_id }}
        FAILING JOB NAME: ${{ matrix.job_name }}
        FAILED STEP: ${{ matrix.step_name }}
        FAILING JOB URL: ${{ matrix.failure_url }}
        TRACKING ISSUE NUMBER (in ROCm/xla): ${{ matrix.issue_number }}
        COMMENT URL (the instruction and usually a proposed fix live
        here, folded; edit this same comment with your findings - never
        post a new one): ${{ matrix.comment_url }}
        INSTRUCTIONS (a human wrote this verbatim after "@claude" in the
        comment above - follow it literally, it governs what you do):
        ${{ matrix.instructions }}
        INSTRUCTIONS HASH (use literally in the Step 0/6 marker, don't
        recompute it): ${{ matrix.instructions_hash }}

        A human added the instructions above by editing the comment,
        asking you to act on this failure - that could mean verifying
        the already-proposed fix, digging further (e.g. setting a
        breakpoint and inspecting specific state), trying a different
        approach, or devising a new solution, depending on what the
        instructions actually say. Run the /respond-to-mention skill,
        using the values above as its arguments: CI repo, issue number,
        comment URL, job name, step name, repository, head SHA, failure
        URL, instructions, instructions hash, in that order. The skill
        self-caps its own non-build decision-making at 30 minutes - time
        spent on actual build+test cycles doesn't count against that,
        but the whole run still has to fit this step's own timeout. The
        skill decides how much of the reproduce/apply/revert protocol
        applies based on what was actually asked, and is responsible for
        editing its findings directly into the comment above via
        `gh api -X PATCH .../issues/comments/<id>`. It never commits,
        pushes, or opens a PR itself - if it ends up with a verified
        fix, it only writes out a patch file plus a PR title/body for a
        later, deterministic workflow step to apply and turn into a
        draft PR. Never post a new comment on the tracking issue, and do
        not post anything to GitHub yourself outside of what the skill
        does.
    secrets: inherit

  apply_patch_and_open_pr:
    name: "Apply fix: ${{ matrix.job_name }} / ${{ matrix.step_name }}"
    needs: [collect_mention_targets, respond_to_mention]
    if: needs.collect_mention_targets.outputs.mention_targets != '[]'
    runs-on: ubuntu-latest
    # Needs to push a branch and open a draft PR, unlike every other job in
    # this workflow (all read-mostly, aside from issue/label edits) -
    # scoped here, not at the workflow level.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Deliberately not `needs.respond_to_mention`'s own per-entry result:
      # a reusable-workflow call's outputs collapse across matrix entries
      # (GitHub Actions only exposes one arbitrary entry's value to a
      # downstream job, not a map keyed by entry), so this job can't learn
      # "did matrix entry N produce a patch" from `respond_to_mention`
      # directly. Instead it reuses the same source matrix and just
      # attempts the download below for every entry, tolerating "no such
      # artifact" as the normal/expected outcome for anything that wasn't
      # verified (not applicable, still red, or a purely investigative
      # ask with no fix) - functionally identical to today's "if the patch
      # file doesn't exist, skip" check, just preceded by a best-effort
      # download instead of being guaranteed by the same job's own earlier
      # step.
      matrix:
        include: ${{ fromJson(needs.collect_mention_targets.outputs.mention_targets) }}
    steps:
      # continue-on-error, not an `if-no-files-found`-style flag: there's
      # no download-side equivalent, so a missing artifact just fails this
      # one step, which is exactly what "nothing to apply" looks like -
      # the file-existence check right below treats that identically to
      # the artifact having been found empty.
      - name: Download patch artifact, if one was produced
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: "mention-patch-${{ matrix.comment_id }}"
          path: /tmp

      # The default GITHUB_TOKEN cannot push a brand-new branch into
      # ROCm/xla: creating a ref requires GitHub to validate whether it
      # introduces/changes anything under .github/workflows/* - a check
      # that needs a "workflows" permission scope the standard Actions
      # token can never carry, regardless of what this job's own
      # `permissions:` block grants (there is no such scope available to
      # it). This bit us for real: the first live verify run got
      # everything right (red->green->red) but failed to push with `POST
      # /git/refs` -> 403 "Resource not accessible by integration" /
      # "workflows scope may be required" - even though the fix itself
      # never touched a workflow file, because that check applies to any
      # brand-new ref, not just to the commit's own diff. Same root cause
      # sync_main_mirror.yml already works around with a scoped GitHub App
      # token - request only `contents`+`workflows` here, the exact same
      # pair that token already works with there. Asking this App token
      # for anything more (pull-requests, issues) fails outright: the
      # installation itself was only ever granted a specific, narrower
      # permission set, and GitHub validates a token request's scopes
      # against that atomically - if even one requested scope exceeds what
      # the installation has, the whole request is rejected with a 422
      # ("level of access... not granted to this installation"), which is
      # exactly what requesting pull-requests/issues on top of this hit.
      # `gh pr create` doesn't need this token anyway: opening a PR against
      # an already-pushed branch is a plain pull-requests:write operation
      # with no workflows-scope involved, and this job's own
      # `permissions:` block already grants that to the default
      # GITHUB_TOKEN - so only the one `git push` below uses this App
      # token, everything else (comment edits, the PR itself) keeps using
      # the default one.
      - name: Create GitHub App token for the branch push only
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ROCM_REPO_MANAGEMENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROCM_REPO_MANAGEMENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      # Configuring this here (a plain workflow step, not an agent Bash
      # tool call) rather than inside the skill matters: Claude Code's own
      # Bash tool refuses to run any command referencing a credential it
      # can't verify is safe before running it, even one injected via
      # `env:` - confirmed in production, embedding a token directly in a
      # skill's own `git remote add ...` command got rejected outright ("A
      # variable in braces in this command can't be checked before it
      # runs"). That's exactly why the skill never pushes or opens the PR
      # itself - it only ever writes a patch file for this job to use.
      # Any `git push`/`git remote add .../ROCm/xla.git` from here on in
      # this job is transparently authenticated without any token, or any
      # variable at all, appearing in anyone's command text.
      - name: Configure git to authenticate pushes to ROCm/xla
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/ROCm/xla.git".insteadOf "https://github.com/ROCm/xla.git"

      - name: Apply verified patch and open PR
        id: open_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -s /tmp/claude_fix.patch ]; then
            echo "No verified fix to apply - skipping."
            exit 0
          fi

          # Derived purely from this step's two real inputs - the commit
          # and the patch - rather than from job/step name metadata: the
          # patch hash disambiguates two different verified fixes landing
          # on the same commit (two unrelated failures at the same
          # head_sha), which a job/step slug would do too, but this way
          # the branch name has no dependency on anything beyond what this
          # step actually consumes.
          SHA_SHORT=$(echo "${{ matrix.head_sha }}" | cut -c1-7)
          PATCH_HASH=$(sha256sum /tmp/claude_fix.patch | cut -c1-8)
          BRANCH="claude/verify-fix/${SHA_SHORT}-${PATCH_HASH}"

          # Base the fix on the exact commit the respond-to-mention skill
          # actually tested (matrix.repository@matrix.head_sha - the same
          # commit the called workflow's "Checkout the commit that failed"
          # step checked out), not on any branch tip. The red->green->red
          # cycle in that skill only proves the fix works against that one
          # commit - rebasing onto a later tip (ROCm/xla's or even
          # openxla/xla's own main) would ship something that was never
          # actually verified. GitHub allows fetching an arbitrary commit
          # SHA directly (no need to walk main's history to find it), and
          # since head_sha only gets older relative to ROCm/xla's main
          # (kept in sync by sync_upstream.yml) the push below is normally
          # pushing a commit the remote already has as an ancestor, not a
          # fresh tip it might not have caught up to yet.
          WORKDIR=$(mktemp -d)
          git -C "$WORKDIR" init -q
          git -C "$WORKDIR" remote add upstream "https://github.com/${{ matrix.repository }}.git"
          git -C "$WORKDIR" fetch -q --depth=1 upstream "${{ matrix.head_sha }}"
          git -C "$WORKDIR" checkout -q -b "$BRANCH" FETCH_HEAD

          if ! git -C "$WORKDIR" apply --check /tmp/claude_fix.patch; then
            echo "::warning::Verified patch no longer applies cleanly to ${{ matrix.head_sha }} - needs a manual rebase"
            exit 0
          fi
          git -C "$WORKDIR" apply /tmp/claude_fix.patch
          git -C "$WORKDIR" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -aq -F /tmp/claude_pr_title.txt

          git -C "$WORKDIR" remote add origin https://github.com/ROCm/xla.git
          if ! git -C "$WORKDIR" push -q origin "HEAD:refs/heads/${BRANCH}"; then
            echo "::warning::Failed to push the verified-fix branch to ROCm/xla"
            exit 0
          fi

          PR_URL=$(gh pr create --repo ROCm/xla --draft \
            --title "$(head -1 /tmp/claude_pr_title.txt)" \
            --body-file /tmp/claude_pr_body.txt \
            --base main --head "$BRANCH") || {
            echo "::warning::Failed to open the draft PR"
            exit 0
          }
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Add the PR link to the tracking comment
        if: steps.open_pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.open_pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          gh api "/repos/ROCm/xla/issues/comments/${{ matrix.comment_id }}" --jq .body > /tmp/comment_before_pr_link.txt
          python3 -I -c "
          import os
          marker = '<!-- rocm-nightly-claude-mention-pr-pending -->'
          link = f\"[draft PR]({os.environ['PR_URL']}) opened with the fix.\"
          body = open('/tmp/comment_before_pr_link.txt').read()
          body = body.replace(marker, link, 1) if marker in body else body
          open('/tmp/comment_after_pr_link.txt', 'w').write(body)
          "
          gh api -X PATCH "/repos/ROCm/xla/issues/comments/${{ matrix.comment_id }}" -F body=@/tmp/comment_after_pr_link.txt
